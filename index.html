<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Voice Notes AI</title>
  
  <!-- Configurazione PWA per iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Voice Notes">
  <link rel="apple-touch-icon" href="https://img.icons8.com/isometric-labels/180/microphone.png">
  
  <!-- Manifest inline per l'installazione PWA -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"Voice Notes AI","short_name":"VoiceNotes","start_url":".","display":"standalone","background_color":"#0f172a","theme_color":"#0f172a","icons":[{"src":"https://img.icons8.com/isometric-labels/180/microphone.png","sizes":"180x180","type":"image/png"}]}'>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
    }
    
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)) 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 12px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      margin-bottom: 16px;
    }
    h1 { margin: 0; font-size: 1.3rem; font-weight: 700; color: var(--accent); }
    
    .api-key-btn {
      background: #334155; border: none; color: var(--text);
      border-radius: 8px; padding: 6px 12px; font-size: 0.85rem; font-weight: 600;
      cursor: pointer;
    }

    .mic-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 16px 0;
    }

    .mic-btn {
      width: 76px; height: 76px; border-radius: 50%;
      background: var(--accent); border: none; color: #000;
      font-size: 2.2rem; cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
      transition: all 0.2s;
    }
    .mic-btn.recording {
      background: var(--danger); color: #fff;
      animation: pulse 1.5s infinite;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.6);
    }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.06); } 100% { transform: scale(1); } }

    .status-text { margin-top: 10px; font-size: 0.85rem; color: var(--text-muted); text-align: center; }

    textarea {
      width: 100%; height: 90px; background: var(--card-bg);
      border: 1px solid #334155; border-radius: 12px; color: var(--text);
      padding: 12px; font-size: 0.95rem; resize: none; outline: none; margin-bottom: 12px;
    }

    .process-btn {
      width: 100%; padding: 14px; background: var(--accent);
      border: none; border-radius: 12px; color: #0f172a; font-weight: 700;
      font-size: 1rem; cursor: pointer; margin-bottom: 24px; transition: opacity 0.2s;
    }
    .process-btn:disabled { opacity: 0.5; }

    .category-card {
      background: var(--card-bg); border-radius: 12px;
      padding: 16px; margin-bottom: 16px; border: 1px solid #334155;
    }
    .category-title {
      font-size: 1rem; font-weight: 600; margin: 0 0 12px 0;
      color: var(--accent); display: flex; align-items: center; gap: 8px;
    }
    .item-list { list-style: none; padding: 0; margin: 0; }
    .item-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0;
      border-bottom: 1px solid #334155;
    }
    .item-row:last-child { border-bottom: none; }
    .item-content { display: flex; align-items: center; gap: 10px; flex-grow: 1; }
    .item-row input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); }
    .item-row span.done { text-decoration: line-through; color: var(--text-muted); }
    .delete-btn {
      background: none; border: none; color: var(--text-muted); font-size: 1.1rem;
      cursor: pointer; padding: 0 4px;
    }
    .delete-btn:hover { color: var(--danger); }
  </style>
</head>
<body>

  <header>
    <h1>🎙️ Voice Notes AI</h1>
    <button class="api-key-btn" onclick="setApiKey()">Chiave API</button>
  </header>

  <div class="mic-container">
    <button class="mic-btn" id="micBtn" onclick="toggleRecording()">🎤</button>
    <div class="status-text" id="statusText">Tocca il microfono e inizia a parlare</div>
  </div>

  <textarea id="transcription" placeholder="Quello che dici apparirà qui... (puoi anche scriverlo o modificarlo a mano)"></textarea>
  <button class="process-btn" id="processBtn" onclick="processWithGemini()">⚡ Organizza con IA</button>

  <div id="resultsContainer"></div>

  <script>
    let apiKey = localStorage.getItem('gemini_api_key') || '';
    let recognition = null;
    let isRecording = false;

    // Configurazione Riconoscimento Vocale iOS Safari
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.lang = 'it-IT';
      recognition.interimResults = true;

      recognition.onresult = (event) => {
        let text = '';
        for (let i = 0; i < event.results.length; ++i) {
          text += event.results[i][0].transcript;
        }
        document.getElementById('transcription').value = text;
      };

      recognition.onerror = (e) => {
        console.error("Errore Microfono:", e);
        stopRecording();
        document.getElementById('statusText').innerText = "Errore microfono. Verifica i permessi in Safari.";
      };

      recognition.onend = () => {
        if (isRecording) stopRecording();
      };
    } else {
      document.getElementById('statusText').innerText = "Dettatura non supportata. Puoi digitare il testo a mano.";
    }

    function toggleRecording() {
      if (!recognition) return alert("Riconoscimento vocale non disponibile su questo browser.");
      if (isRecording) { stopRecording(); } else { startRecording(); }
    }

    function startRecording() {
      try {
        isRecording = true;
        document.getElementById('micBtn').classList.add('recording');
        document.getElementById('statusText').innerText = "In ascolto... Tocca di nuovo per fermare.";
        recognition.start();
      } catch (e) {
        console.error(e);
      }
    }

    function stopRecording() {
      isRecording = false;
      document.getElementById('micBtn').classList.remove('recording');
      document.getElementById('statusText').innerText = "Registrazione completata.";
      if (recognition) recognition.stop();
    }

    function setApiKey() {
      const key = prompt("Incolla la tua Chiave API di Google Gemini:", apiKey);
      if (key !== null) {
        apiKey = key.trim();
        localStorage.setItem('gemini_api_key', apiKey);
        alert("Chiave API salvata con successo!");
      }
    }

    async function processWithGemini() {
      const text = document.getElementById('transcription').value.trim();
      if (!text) return alert("Scrivi o detta prima qualcosa!");
      
      if (!apiKey) {
        alert("Inserisci la tua chiave API di Google Gemini cliccando in alto a destra su 'Chiave API'.");
        setApiKey();
        return;
      }

      const btn = document.getElementById('processBtn');
      btn.disabled = true;
      btn.innerText = "Elaborazione in corso...";

      const promptText = `Analizza questo testo e riorganizzalo estraendo gli elementi in un oggetto JSON valido.
Se l'utente si corregge nel testo, tieni conto della correzione.

Categorie richieste:
- "spesa": cose o cibo da comprare
- "scadenze": pagamenti o impegni con una data precisa
- "appuntamenti": visite, riunioni o appuntamenti
- "altro": tutte le altre attività da fare

Rispondi ESCLUSIVAMENTE con il JSON formattato. Esempio:
{"spesa":["Latte"],"scadenze":["Bolletta entro il 20"],"appuntamenti":["Dentista martedì ore 15"],"altro":[]}

Testo da analizzare: "${text}"`;

      try {
        cconst response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-lite:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error?.message || `Errore HTTP ${response.status}`);
        }

        const rawResponse = data.candidates[0].content.parts[0].text;
        
        // Estrattore JSON ultra-sicuro (trova il JSON anche se circondato da altro testo)
        const jsonMatch = rawResponse.match(/\{[\s\S]*\}/);
        if (!jsonMatch) {
          throw new Error("L'IA non ha restituito un formato JSON valido. Riprova.");
        }

        const structuredData = JSON.parse(jsonMatch[0]);
        saveAndRenderData(structuredData);
        document.getElementById('transcription').value = '';
      } catch (err) {
        alert("⚠️ ERRORE ELABORAZIONE:\n" + err.message);
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.innerText = "⚡ Organizza con IA";
      }
    }

    function saveAndRenderData(newData) {
      let currentData = JSON.parse(localStorage.getItem('my_voice_notes') || '{"spesa":[], "scadenze":[], "appuntamenti":[], "altro":[]}');
      
      for (let key in newData) {
        if (currentData[key] && Array.isArray(newData[key])) {
          currentData[key] = [...currentData[key], ...newData[key]];
        }
      }
      localStorage.setItem('my_voice_notes', JSON.stringify(currentData));
      renderUI();
    }

    function deleteItem(cat, index) {
      let data = JSON.parse(localStorage.getItem('my_voice_notes'));
      data[cat].splice(index, 1);
      localStorage.setItem('my_voice_notes', JSON.stringify(data));
      renderUI();
    }

    function renderUI() {
      const data = JSON.parse(localStorage.getItem('my_voice_notes') || '{"spesa":[], "scadenze":[], "appuntamenti":[], "altro":[]}');
      const container = document.getElementById('resultsContainer');
      container.innerHTML = '';

      const labels = {
        spesa: "🛒 Lista della Spesa",
        scadenze: "⚠️ Scadenze e Pagamenti",
        appuntamenti: "📅 Appuntamenti e Visite",
        altro: "📌 Altre Attività"
      };

      let hasItems = false;

      for (let cat in data) {
        if (!data[cat] || data[cat].length === 0) continue;
        hasItems = true;

        const card = document.createElement('div');
        card.className = 'category-card';
        card.innerHTML = `<h3 class="category-title">${labels[cat]}</h3>`;

        const list = document.createElement('ul');
        list.className = 'item-list';

        data[cat].forEach((item, index) => {
          const li = document.createElement('li');
          li.className = 'item-row';
          li.innerHTML = `
            <div class="item-content">
              <input type="checkbox" onchange="toggleDone(this)">
              <span>${item}</span>
            </div>
            <button class="delete-btn" onclick="deleteItem('${cat}', ${index})" title="Elimina">✕</button>
          `;
          list.appendChild(li);
        });

        card.appendChild(list);
        container.appendChild(card);
      }

      if (!hasItems) {
        container.innerHTML = '<div style="text-align:center; color:var(--text-muted); font-size:0.9rem; padding:20px;">Nessuna nota salvata. Detta qualcosa per iniziare!</div>';
      }
    }

    function toggleDone(checkbox) {
      const span = checkbox.nextElementSibling;
      if (checkbox.checked) {
        span.classList.add('done');
      } else {
        span.classList.remove('done');
      }
    }

    // Carica le note salvate all'avvio
    renderUI();
  </script>
</body>
</html>
